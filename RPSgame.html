<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors </title>
    <style>
      body {
        background-color: rgb(30, 30, 30);
        color:whitesmoke;
        font-family: Arial;
        
      }
      .title {
        font-size: 50px;
        font-weight: bold;
        margin-left: 460px;
      }
      .move-icon {
        height:70px;
        
      }
      .move-button {
        background-color: transparent;
        border:1px solid white;
        width: 200px;
        height: 200px;
        border-width: 5px;
        border-radius: 100px;
        margin-left: 200px;
        margin-top: -10px;
        cursor: pointer;
        transition: all 0.3 ease;

      }
      .move-button:hover {
        border-color: rgb(0, 200, 255);
        transform: scale(1.05);
        box-shadow: 0 0 20px rgb(0, 200, 255);
      }
      .result {
        font-size: 25px;
        font-weight: bold;
        margin-top: 50px;
        margin-left: 555px;
      }
      .result-move {
        height: 70px;
        margin-left: 10px;
      }
      .score {
        margin-top: 40px;
        margin-left: 615px;
      }
      .reset-button{
        background-color: rgb(30, 30, 30);
        color: white;
        border:white;
        border-width: 5px;
        font-size: 18px;
        padding: 20px 15px;
        cursor: pointer;
        border-radius: 40px;
        margin-left: 640px;
        margin-top: 20px;
      }
      .reset-button:hover {
        border-color: rgb(0, 200, 255);
        transform: scale(1.05);
        box-shadow: 0 0 20px rgb(0, 200, 255);

      }
      .print-result{
        font-size: 35px;
        font-weight: bold;
        margin-left: 638px;
      }
      
    </style>
   
  </head>
  <body>
    
    <p class="title">Rock Paper Scissors</p>
    <div>
    <button onclick="
      play('rock');
    " class="move-button"><img src="images/rock-emoji.png" class="move-icon"></button>
    <button onclick="
      play('paper');
    " class="move-button"><img src="images/paper-emoji.png" class="move-icon"></button>
    <button onclick="
      play('scissors');
    " class="move-button"><img src="images/scissors-emoji.png" class="move-icon" ></button>
    
    <button onclick="
      reset();
    " class="reset-button">Reset Score</button>
    <p class="js-result print-result"></p>
    <p class="js-moves result">
    </p>
    <p class ="js-score score"></p>

  <script src="srcipt.js"></script>

  </body>

</html>
