<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors </title>
    <style>
      body {
        background-color: rgb(30, 30, 30);
        color:whitesmoke;
        font-family: Arial;
        
      }
      .title {
        font-size: 50px;
        font-weight: bold;
        margin-left: 460px;
      }
      .move-icon {
        height:70px;
        
      }
      .move-button {
        background-color: transparent;
        border:1px solid white;
        width: 200px;
        height: 200px;
        border-width: 5px;
        border-radius: 100px;
        margin-left: 200px;
        margin-top: -10px;
        cursor: pointer;
        transition: all 0.3 ease;

      }
      .move-button:hover {
        border-color: rgb(0, 200, 255);
        transform: scale(1.05);
        box-shadow: 0 0 20px rgb(0, 200, 255);
      }
      .result {
        font-size: 25px;
        font-weight: bold;
        margin-top: 50px;
        margin-left: 555px;
      }
      .result-move {
        height: 70px;
        margin-left: 10px;
      }
      .score {
        margin-top: 40px;
        margin-left: 615px;
      }
      .reset-button{
        background-color: rgb(30, 30, 30);
        color: white;
        border:white;
        border-width: 5px;
        font-size: 18px;
        padding: 20px 15px;
        cursor: pointer;
        border-radius: 40px;
        margin-left: 640px;
        margin-top: 20px;
      }
      .reset-button:hover {
        border-color: rgb(0, 200, 255);
        transform: scale(1.05);
        box-shadow: 0 0 20px rgb(0, 200, 255);

      }
      .print-result{
        font-size: 35px;
        font-weight: bold;
        margin-left: 638px;
      }
      
    </style>
   
  </head>
  <body>
    
    <p class="title">Rock Paper Scissors</p>
    <div>
    <button onclick="
      play('rock');
    " class="move-button"><img src="images/rock-emoji.png" class="move-icon"></button>
    <button onclick="
      play('paper');
    " class="move-button"><img src="images/paper-emoji.png" class="move-icon"></button>
    <button onclick="
      play('scissors');
    " class="move-button"><img src="images/scissors-emoji.png" class="move-icon" ></button>
    
    <button onclick="
      reset();
    " class="reset-button">Reset Score</button>
    <p class="js-result print-result"></p>
    <p class="js-moves result">
    </p>
    <p class ="js-score score"></p>

  <script>
    //Retrieve score from localStorage if it exists 
    // if not initialize a default score obj
    let score = JSON.parse(localStorage.getItem('score')) || 
     {
        wins: 0,
        losses: 0,
        ties: 0
      };

      updateScore();
    // reset score object function
    function reset(){
     
      score = {
        wins: 0,
        losses: 0,
        ties: 0
      };
      //Remove saved score from localStorage for reset
      localStorage.removeItem('score');
      updateScore();

    }
   
    // Generate a random number between 0 and 1 and decide RPS
    function pickCompMove() {
      let compMove = '';
      const randomNum = Math.random();
      
      if (randomNum >=0 && randomNum < (1 / 3)){
       compMove = 'rock';

      } else if(randomNum >= 1 / 3 && randomNum < (2 / 3)) {
     compMove = 'paper'; 
      } else if(randomNum >= 2/3 && randomNum < 1){
     compMove = 'scissors'; 
      }
      return compMove;
    }
    // get Computer s move and display the result in the page
    function play(move){
      const computerMove = pickCompMove();
      let result = '';
      if(move === 'scissors'){
        if(computerMove === 'rock'){
          result = 'You lose';

        } else if(computerMove === 'paper'){
          result = 'You win';
        } else if(computerMove === 'scissors'){
          result = 'Tie';
        }
      }

      if(move === 'paper'){
        if(computerMove === 'rock'){
          result = 'You win';

        } else if(computerMove === 'paper'){
          result = 'Tie';
        } else if(computerMove === 'scissors'){
          result = 'You lose';
        }
      }
     if(move === 'rock'){
        if(computerMove === 'rock'){
          result = 'Tie';

        } else if(computerMove === 'paper'){
          result = 'You lose';
        } else if(computerMove === 'scissors'){
          result = 'You win';
        }
      } 
      if(result === 'You win'){
        score.wins += 1;
      } else if (result === 'You lose'){
        score.losses +=1;
      } else if(result === 'Tie'){
        score.ties +=1;
      }
      //Save updated score
      localStorage.setItem('score', JSON.stringify(score));
      
      
      updateScore();
      document.querySelector('.js-result').innerHTML = result;

      document.querySelector('.js-moves').innerHTML = `You 
    <img src="images/${move}-emoji.png" class="result-move">
    <img src="images/${computerMove}-emoji.png" class="result-move">  Computer`;
    

    
    

    }// display the current score on the page
    function updateScore(){
      document.querySelector('.js-score').innerHTML = 
      `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
    }

    
  </script>

  </body>

</html>
