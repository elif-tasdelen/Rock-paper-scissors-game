<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors </title>
   
  </head>
  <body>
    
    <p>Rock Paper Scissors</p>
    <button onclick="
      play('rock');
    ">Rock</button>
    <button onclick="
      play('paper');
    ">Paper</button>
    <button onclick="
      play('scissors');
    ">Scissors</button>
    <button onclick="
      reset();
    ">Reset Score</button>

  <script>
  
    let score = JSON.parse(localStorage.getItem('score')) || 
     {
        wins: 0,
        losses: 0,
        ties: 0
      };


    function reset(){
     
      score = {
        wins: 0,
        losses: 0,
        ties: 0
      };
      localStorage.removeItem('score');
    }
   

    function pickCompMove() {
      let compMove = '';
      const randomNum = Math.random();
      
      if (randomNum >=0 && randomNum < (1 / 3)){
       compMove = 'rock';

      } else if(randomNum >= 1 / 3 && randomNum < (2 / 3)) {
     compMove = 'paper'; 
      } else if(randomNum >= 2/3 && randomNum < 1){
     compMove = 'scissors'; 
      }
      return compMove;
    }

    function play(move){
      const computerMove = pickCompMove();
      let result = '';
      if(move === 'scissors'){
        if(computerMove === 'rock'){
          result = 'You lose';

        } else if(computerMove === 'paper'){
          result = 'You win';
        } else if(computerMove === 'scissors'){
          result = 'Tie';
        }
      }

      if(move === 'paper'){
        if(computerMove === 'rock'){
          result = 'You win';

        } else if(computerMove === 'paper'){
          result = 'Tie';
        } else if(computerMove === 'scissors'){
          result = 'You lose';
        }
      }
     if(move === 'rock'){
        if(computerMove === 'rock'){
          result = 'Tie';

        } else if(computerMove === 'paper'){
          result = 'You lose';
        } else if(computerMove === 'scissors'){
          result = 'You win';
        }
      } 
      if(result === 'You win'){
        score.wins += 1;
      } else if (result === 'You lose'){
        score.losses +=1;
      } else if(result === 'Tie'){
        score.ties +=1;
      }

      localStorage.setItem('score', JSON.stringify(score));
    

    alert(`You picked ${move}. Computer picked ${computerMove}. ${result}
    Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
    

    }


  </script>

  </body>

</html>
